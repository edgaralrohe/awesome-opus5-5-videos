<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reel — Colores Ruidosos</title>
<style>
  @font-face { font-family: "Instrument Serif"; font-style: normal; font-weight: 400; src: url(src/fonts/instrument-serif-latin-400-normal.woff2) format("woff2"); }
  @font-face { font-family: "Instrument Serif"; font-style: italic; font-weight: 400; src: url(src/fonts/instrument-serif-latin-400-italic.woff2) format("woff2"); }
  @font-face { font-family: "Inter"; font-style: normal; font-weight: 500; src: url(src/fonts/inter-latin-500-normal.woff2) format("woff2"); }
  @font-face { font-family: "Inter"; font-style: normal; font-weight: 700; src: url(src/fonts/inter-latin-700-normal.woff2) format("woff2"); }
  :root { --bg: #111110; --fg: #e8e4d8; --muted: #8e8a80; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg); font: 500 14px Inter, system-ui, sans-serif;
         display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 16px; }
  canvas { height: min(84vh, 1920px); max-width: 100%; aspect-ratio: 9 / 16; display: block; box-shadow: 0 10px 40px #0008; }
  .controls { display: flex; align-items: center; gap: 12px; width: min(100%, calc(84vh * 9 / 16)); }
  button { background: var(--fg); color: var(--bg); border: 0; padding: 8px 14px; font: inherit; border-radius: 4px; cursor: pointer; min-width: 72px; }
  input[type=range] { flex: 1; accent-color: var(--fg); }
  #time { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 110px; text-align: right; }
  body.render { padding: 0; display: block; }
  body.render canvas { height: auto; width: 1080px; box-shadow: none; }
  body.render .controls { display: none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="controls">
  <button id="play">Play</button>
  <input id="scrub" type="range" min="0" max="76" step="0.0333" value="0">
  <span id="time">0.00 s</span>
</div>
<script>if (location.search.includes('render')) document.body.classList.add('render');</script>
<script type="module" src="src/reel/main.js"></script>
</body>
</html>
