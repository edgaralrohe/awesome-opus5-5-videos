<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Crisbet Podología · video</title>
<style>
@font-face{font-family:'Montserrat';font-weight:400 700;font-display:block;src:url(assets/montserrat-latin.woff2) format('woff2')}
:root{--negro:#000;--texto:#F5F2EA;--texto2:#A9A396;--oro:#C9A455;--oro-cl:#EDDAB2;--sup:#151412}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--negro);color:var(--texto);
  font-family:'Montserrat',sans-serif;-webkit-font-smoothing:antialiased}

/* ░ texto de la escena ░ */
.cab{position:absolute;left:70px;right:70px;top:96px;height:340px;display:flex;flex-direction:column;justify-content:center}
.eti{font-weight:600;font-size:30px;letter-spacing:.28em;text-transform:uppercase;color:var(--oro)}
.txt{font-weight:600;font-size:62px;line-height:1.12;letter-spacing:-.01em;margin-top:18px;text-wrap:balance}

/* ░ el celular ░ */
.cel{position:absolute;left:50%;top:470px;width:722px;height:1370px;margin-left:-361px;
  border-radius:74px;background:#1d1b18;padding:20px;box-shadow:0 0 0 2px #3a3631,0 40px 120px rgba(201,164,85,.16)}
.pantalla{width:682px;height:1330px;border-radius:56px;overflow:hidden;background:#0B0B0A;position:relative}
.pantalla iframe{width:390px;height:760px;border:0;transform:scale(1.7487);transform-origin:0 0;display:block}

/* ░ toque ░ */
.toque{position:absolute;width:150px;height:150px;border-radius:50%;pointer-events:none;
  border:6px solid var(--oro);background:rgba(201,164,85,.22);transform:translate(-50%,-50%);opacity:0;z-index:5}
.dedo{position:absolute;width:46px;height:46px;border-radius:50%;pointer-events:none;
  background:rgba(237,218,178,.85);box-shadow:0 0 0 6px rgba(0,0,0,.25);transform:translate(-50%,-50%);opacity:0;z-index:6}

/* ░ progreso ░ */
.prog{position:absolute;left:70px;right:70px;top:1872px;height:6px;border-radius:3px;background:#24211d;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--oro)}

/* ░ tarjetas de inicio y cierre ░ */
.tarjeta{position:absolute;inset:0;background:var(--negro);z-index:10;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;opacity:0}
#intro{opacity:1}
.tarjeta .pie-logo{width:330px;height:auto}
.tarjeta h1{font-weight:600;font-size:132px;line-height:.95;letter-spacing:.03em;text-transform:uppercase;margin-top:70px}
.tarjeta h1 small{display:block;font-weight:400;font-size:38px;letter-spacing:.42em;margin-top:26px}
.tarjeta .lema{font-weight:500;font-size:50px;line-height:1.25;color:var(--oro-cl);margin-top:90px;max-width:16ch}
#cierre .logo{width:820px;height:auto}
#cierre .llama{font-weight:500;font-size:44px;color:var(--texto2);margin-top:110px}
#cierre .tel{font-weight:700;font-size:112px;letter-spacing:.01em;color:var(--oro);margin-top:16px;display:flex;align-items:center;gap:30px}
#cierre .tel svg{width:84px;height:84px}
#cierre .donde{font-weight:500;font-size:38px;margin-top:70px;line-height:1.45}
#cierre .donde span{color:var(--texto2);display:block;font-size:32px}
</style>
</head>
<body>
<div class="cab"><div class="eti" id="eti"></div><div class="txt" id="txt"></div></div>
<div class="cel"><div class="pantalla"><iframe id="pag" src="assets/pagina.html" scrolling="no"></iframe></div></div>
<div class="prog"><i id="prog"></i></div>

<div class="tarjeta" id="intro">
  <div id="intro-pie"></div>
  <h1>Crisbet<small>Podología</small></h1>
  <p class="lema">Así funciona tu página web</p>
</div>
<div class="tarjeta" id="cierre">
  <div id="cierre-logo"></div>
  <p class="llama">Pide tu cita por WhatsApp</p>
  <p class="tel"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 00-8.6 15L2 22l5.2-1.4A10 10 0 1012 2z"/></svg>55 9108 1144</p>
  <p class="donde">Ecatepec de Morelos<span>Lun · Mar · Mié · Vie · Sáb, 11:00 a 20:00</span></p>
</div>

<script src="escenas.js"></script>
<script>
const $ = id => document.getElementById(id);
const frame = $('pag');
let F, W; // documento y ventana de la página

window.listo = new Promise(res => frame.addEventListener('load', async () => {
  F = frame.contentDocument; W = frame.contentWindow;
  await Promise.all([document.fonts.ready, F.fonts.ready]);
  // los logos salen de la propia página
  const pie = F.querySelector('.pie-hero svg').cloneNode(true);
  pie.classList.add('pie-logo'); $('intro-pie').appendChild(pie);
  const logo = F.querySelector('footer.cierre svg').cloneNode(true);
  logo.classList.add('logo'); $('cierre-logo').appendChild(logo);
  res(true);
}));

const suave = p => p < .5 ? 4*p*p*p : 1 - Math.pow(-2*p + 2, 3) / 2;
const anima = (el, kf, ms, delay = 0) => el.animate(kf, { duration: ms, delay, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'both' });

/* ░ toque: círculo dorado sobre el elemento ░ */
function toque(el){
  const r = el.getBoundingClientRect(), fr = frame.getBoundingClientRect(), s = fr.width / 390;
  const x = fr.left + (r.left + r.width / 2) * s, y = fr.top + (r.top + r.height / 2) * s;
  for (const [cls, kf, ms] of [
    ['toque', [{opacity:.95, transform:'translate(-50%,-50%) scale(.3)'}, {opacity:0, transform:'translate(-50%,-50%) scale(1.5)'}], 900],
    ['dedo',  [{opacity:0}, {opacity:1, offset:.15}, {opacity:1, offset:.6}, {opacity:0}], 800],
  ]) {
    const d = document.createElement('div'); d.className = cls;
    d.style.left = x + 'px'; d.style.top = y + 'px';
    document.body.appendChild(d); anima(d, kf, ms);
  }
}

/* ░ un paso en el tiempo t ░ */
const est = new Map();
function paso(p, t){
  const e = est.get(p) || {};
  if (e.fin || t < p.at) return;
  const el = F.querySelector(p.sel);
  const prog = p.dur ? Math.min(1, (t - p.at) / p.dur) : 1;
  if (p.hacer === 'scroll') {
    if (e.y0 === undefined) {
      e.y0 = W.scrollY;
      const max = F.documentElement.scrollHeight - W.innerHeight;
      e.y1 = Math.max(0, Math.min(max, el.getBoundingClientRect().top + W.scrollY - p.off));
    }
    W.scrollTo(0, e.y0 + (e.y1 - e.y0) * suave(prog));
  } else if (p.hacer === 'click') { toque(el); el.click(); }
  else if (p.hacer === 'senalar') toque(el);
  else if (p.hacer === 'escribir') {
    if (e.base === undefined) { e.base = p.agregar ? el.value : ''; el.focus({ preventScroll: true }); }
    const v = e.base + p.texto.slice(0, Math.round(prog * p.texto.length));
    if (el.value !== v) { el.value = v; el.dispatchEvent(new Event('input', { bubbles: true })); }
  }
  if (prog >= 1) e.fin = true;
  est.set(p, e);
}

/* ░ reloj: todas las animaciones CSS avanzan con t, no con el reloj real ░ */
const vistas = new WeakMap();
function reloj(doc, ms){
  for (const a of doc.getAnimations()) {
    if (!vistas.has(a)) vistas.set(a, ms);
    a.pause(); a.currentTime = ms - vistas.get(a);
  }
}

let actual = -1;
window.irA = t => {
  const i = ESCENAS.findIndex(e => t >= e.t && t < e.t + e.dur);
  const n = i < 0 ? ESCENAS.length - 1 : i;
  if (n !== actual) {
    const esc = ESCENAS[n], prev = ESCENAS[actual];
    if (esc.texto) {
      const cambiaEti = !prev || prev.etiqueta !== esc.etiqueta;
      $('eti').textContent = esc.etiqueta; $('txt').textContent = esc.texto;
      if (cambiaEti) anima($('eti'), [{opacity:0, transform:'translateY(16px)'}, {opacity:1, transform:'none'}], 450);
      anima($('txt'), [{opacity:0, transform:'translateY(26px)'}, {opacity:1, transform:'none'}], 550);
    }
    if (prev && prev.tarjeta === 'intro') anima($('intro'), [{opacity:1}, {opacity:0}], 600);
    if (esc.tarjeta === 'intro') {
      anima($('intro-pie'), [{opacity:0, transform:'translateY(60px) rotate(-6deg)'}, {opacity:1, transform:'none'}], 1100);
      anima(document.querySelector('#intro h1'), [{opacity:0, transform:'translateY(30px)'}, {opacity:1, transform:'none'}], 700, 350);
      anima(document.querySelector('#intro .lema'), [{opacity:0}, {opacity:1}], 700, 900);
    }
    if (esc.tarjeta === 'cierre') {
      anima($('cierre'), [{opacity:0}, {opacity:1}], 600);
      anima($('cierre-logo'), [{opacity:0, transform:'scale(.92)'}, {opacity:1, transform:'none'}], 900, 200);
      anima(document.querySelector('#cierre .tel'), [{opacity:0, transform:'translateY(24px)'}, {opacity:1, transform:'none'}], 700, 900);
    }
    actual = n;
  }
  for (const e of ESCENAS) for (const p of e.pasos || []) paso(p, t);
  $('prog').style.width = (Math.min(1, t / DURACION) * 100) + '%';
  reloj(document, t * 1000); reloj(F, t * 1000);
  return true;
};
</script>
</body>
</html>
