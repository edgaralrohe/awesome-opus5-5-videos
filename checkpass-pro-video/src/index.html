<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>CheckPass PRO Events — 30s</title>
<link rel="stylesheet" href="../node_modules/@fontsource/playfair-display/600.css">
<link rel="stylesheet" href="../node_modules/@fontsource/playfair-display/700.css">
<link rel="stylesheet" href="../node_modules/@fontsource/playfair-display/600-italic.css">
<link rel="stylesheet" href="../node_modules/@fontsource/plus-jakarta-sans/400.css">
<link rel="stylesheet" href="../node_modules/@fontsource/plus-jakarta-sans/500.css">
<link rel="stylesheet" href="../node_modules/@fontsource/plus-jakarta-sans/600.css">
<link rel="stylesheet" href="../node_modules/@fontsource/plus-jakarta-sans/700.css">
<link rel="stylesheet" href="../node_modules/@fontsource/plus-jakarta-sans/800.css">
<style>
  :root {
    --bg: #0D0E15; --card: #161922; --border: #262B3A;
    --violet: #7C3AED; --cta-from: #7928CA; --cta-to: #581C87;
    --ch-title: #F1E3B8; --ch-icon: #E8D5A3; --ch-muted: #C8B78A;
    --text: #FFFFFF; --text2: #94A3B8; --text3: #64748B;
    --ok: #22C55E; --pending: #F59E0B; --alert: #EF4444;
    --serif: 'Playfair Display', Georgia, serif;
    --sans: 'Plus Jakarta Sans', 'Inter', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--bg);
    font-family: var(--sans); color: var(--text); }
  .bg-glow { position: absolute; inset: -200px; pointer-events: none; }
  #particles { position: absolute; inset: 0; }
  .dust { position: absolute; border-radius: 50%; background: var(--ch-icon); }
  .scene { position: absolute; inset: 0; opacity: 0; will-change: opacity, transform; }

  /* Headline común (zona segura: top 220) */
  .headline { position: absolute; top: 220px; left: 0; right: 0; text-align: center; padding: 0 70px; }
  .headline .l1, .headline .l2 { display: block; font-family: var(--serif); font-weight: 700; font-size: 84px; line-height: 1.08; letter-spacing: -0.5px; }
  .headline .l1 { color: var(--text); }
  .headline .l2 { color: var(--ch-title); font-style: italic; font-weight: 600; }
  .kicker { display: inline-flex; align-items: center; gap: 14px; margin-bottom: 26px; padding: 12px 26px; border-radius: 999px;
    border: 1.5px solid var(--border); background: rgba(22,25,34,.8); font-size: 26px; font-weight: 600; letter-spacing: 3px; color: var(--ch-muted); text-transform: uppercase; }
  .kicker i { width: 12px; height: 12px; border-radius: 50%; background: var(--violet); box-shadow: 0 0 14px var(--violet); }

  .card { background: var(--card); border: 1.5px solid var(--border); border-radius: 24px; }
  .chip { display: inline-flex; align-items: center; gap: 10px; padding: 10px 20px; border-radius: 999px; font-weight: 700; font-size: 24px; }

  /* Teléfono */
  .phone { position: absolute; left: 50%; top: 640px; width: 560px; height: 1000px; margin-left: -280px; border-radius: 72px;
    background: #05060A; border: 3px solid #2E3344; box-shadow: 0 60px 120px rgba(0,0,0,.6), 0 0 0 10px #12141C, 0 0 120px rgba(124,58,237,.25); }
  .phone .screen { position: absolute; inset: 14px; border-radius: 60px; overflow: hidden; background: var(--bg); }
  .phone .notch { position: absolute; top: 18px; left: 50%; width: 120px; height: 34px; margin-left: -60px; border-radius: 20px; background: #000; z-index: 5; }

  /* Hook */
  .paper { position: absolute; left: 190px; top: 700px; width: 700px; height: 820px; border-radius: 18px; background: #EFE6CF;
    box-shadow: 0 40px 80px rgba(0,0,0,.55); padding: 70px 70px; color: #2B2A33; }
  .paper h4 { font-family: var(--serif); font-size: 44px; font-weight: 700; margin-bottom: 30px; color: #3a3550; }
  .paper .row { position: relative; font-family: var(--serif); font-style: italic; font-size: 40px; height: 76px; line-height: 76px; border-bottom: 2px solid rgba(80,70,110,.18); }
  .paper .strike { position: absolute; left: -10px; top: 38px; height: 5px; background: #4b4560; border-radius: 3px; width: 0; transform: rotate(-2deg); }
  .paper .scrib { position: absolute; right: 0; top: 0; font-family: var(--sans); font-style: normal; font-size: 26px; font-weight: 700; color: #8a7f9e; }

  /* Wordmark */
  .wordmark { display: flex; align-items: center; justify-content: center; gap: 18px; }
  .wordmark .name { font-family: var(--sans); font-weight: 800; font-size: 92px; letter-spacing: -2px; }
  .wordmark .name b { color: var(--violet); font-weight: 800; }
  .pill-events { padding: 10px 22px; border-radius: 999px; border: 2px solid var(--ch-icon); color: var(--ch-icon); font-weight: 700; font-size: 26px; letter-spacing: 6px; }
  .tagline { font-family: var(--sans); font-weight: 600; font-size: 34px; letter-spacing: 8px; text-transform: uppercase; color: var(--ch-muted); text-align: center; }

  /* Escáner */
  .appbar { position: absolute; top: 70px; left: 34px; right: 34px; display: flex; justify-content: space-between; align-items: center; }
  .appbar .t { font-weight: 800; font-size: 30px; }
  .appbar .t small { display: block; font-size: 20px; font-weight: 600; color: var(--text2); margin-top: 4px; }
  .bolt { padding: 8px 16px; border-radius: 999px; background: linear-gradient(135deg, var(--cta-from), var(--cta-to)); font-weight: 800; font-size: 18px; letter-spacing: 1px; }
  .counterbar { position: absolute; top: 170px; left: 34px; right: 34px; height: 92px; display: flex; align-items: center; justify-content: space-between; padding: 0 26px; }
  .counterbar .lbl { color: var(--text2); font-size: 22px; font-weight: 600; }
  .counterbar .num { font-family: var(--serif); font-weight: 700; font-size: 46px; color: var(--ch-title); }
  .counterbar .num span { font-family: var(--sans); font-size: 24px; color: var(--text3); font-weight: 600; }
  .viewfinder { position: absolute; left: 66px; top: 300px; width: 400px; height: 400px; }
  .viewfinder .corner { position: absolute; width: 76px; height: 76px; border: 8px solid var(--ch-icon); }
  .viewfinder .c1 { left: 0; top: 0; border-right: 0; border-bottom: 0; border-top-left-radius: 28px; }
  .viewfinder .c2 { right: 0; top: 0; border-left: 0; border-bottom: 0; border-top-right-radius: 28px; }
  .viewfinder .c3 { left: 0; bottom: 0; border-right: 0; border-top: 0; border-bottom-left-radius: 28px; }
  .viewfinder .c4 { right: 0; bottom: 0; border-left: 0; border-top: 0; border-bottom-right-radius: 28px; }
  .scanline { position: absolute; left: 20px; right: 20px; height: 6px; border-radius: 3px; background: var(--violet);
    box-shadow: 0 0 30px 8px rgba(124,58,237,.7); }
  .pass { position: absolute; left: 50%; top: 50%; width: 300px; height: 300px; margin: -150px 0 0 -150px; border-radius: 24px; background: #fff; padding: 22px; }
  .flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  .result { position: absolute; left: 24px; right: 24px; bottom: 30px; height: 220px; padding: 28px; display: flex; gap: 24px; align-items: center; }
  .okdot { flex: none; width: 96px; height: 96px; border-radius: 50%; background: rgba(34,197,94,.14); border: 3px solid var(--ok); display: grid; place-items: center; }
  .result .who { font-weight: 800; font-size: 32px; }
  .result .who small { display: block; font-weight: 600; font-size: 22px; color: var(--text2); margin-bottom: 4px; }
  .result .meta { margin-top: 12px; display: flex; gap: 10px; }
  .chip.ok { background: rgba(34,197,94,.14); color: var(--ok); font-size: 20px; padding: 8px 16px; }
  .chip.mute { background: #20242F; color: var(--ch-icon); font-size: 20px; padding: 8px 16px; }
  .hint { position: absolute; left: 0; right: 0; top: 720px; text-align: center; color: var(--text3); font-size: 20px; font-weight: 600; letter-spacing: 2px; }

  /* Invitaciones */
  .invite-card { position: absolute; left: 140px; top: 620px; width: 800px; height: 340px; border-radius: 24px; padding: 40px 48px;
    background: linear-gradient(145deg, #1B1E2A, #12141C); border: 2px solid rgba(232,213,163,.55); display: flex; gap: 40px; align-items: center;
    box-shadow: 0 40px 90px rgba(0,0,0,.5); }
  .invite-card .names { font-family: var(--serif); font-style: italic; font-weight: 600; font-size: 58px; color: var(--ch-title); line-height: 1.05; }
  .invite-card .date { margin-top: 18px; font-weight: 700; letter-spacing: 6px; color: var(--ch-muted); font-size: 22px; }
  .invite-card .mini { margin-top: 14px; color: var(--text2); font-size: 22px; font-weight: 500; }
  .invite-card .qrbox { flex: none; width: 220px; height: 220px; background: #fff; border-radius: 18px; padding: 16px; }
  .queue { position: absolute; left: 90px; right: 90px; top: 1010px; height: 590px; padding: 34px 36px; }
  .queue h5 { display: flex; justify-content: space-between; align-items: center; font-size: 28px; font-weight: 800; margin-bottom: 16px; }
  .queue h5 span { color: var(--text2); font-size: 22px; font-weight: 600; }
  .qrow { display: flex; align-items: center; gap: 22px; height: 84px; border-top: 1.5px solid var(--border); }
  .avatar { flex: none; width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 22px; color: var(--bg); background: var(--ch-icon); }
  .qrow .n { flex: 1; font-size: 27px; font-weight: 600; }
  .qrow .n small { display: block; font-size: 19px; color: var(--text3); font-weight: 500; }
  .st { position: relative; width: 210px; height: 46px; }
  .st .chip { position: absolute; right: 0; top: 0; font-size: 20px; padding: 8px 16px; }
  .chip.pend { background: rgba(245,158,11,.14); color: var(--pending); }
  .progress { margin-top: 18px; height: 12px; border-radius: 6px; background: #20242F; overflow: hidden; }
  .progress i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--cta-from), var(--violet)); border-radius: 6px; }

  /* Mesas */
  .floor { position: absolute; left: 70px; right: 70px; top: 620px; height: 980px; padding: 0; overflow: hidden; }
  .floor svg { position: absolute; inset: 0; }
  .tip { position: absolute; padding: 18px 24px; border-radius: 20px; background: rgba(13,14,21,.92); border: 1.5px solid var(--violet);
    box-shadow: 0 20px 40px rgba(0,0,0,.5), 0 0 30px rgba(124,58,237,.35); font-weight: 700; font-size: 26px; white-space: nowrap; }
  .tip small { display: block; color: var(--text2); font-weight: 600; font-size: 20px; margin-top: 4px; }
  .floorchip { position: absolute; left: 34px; top: 30px; }
  .chip.dark { background: #20242F; color: var(--text); font-size: 22px; border: 1.5px solid var(--border); }

  /* Dashboard */
  .dash { position: absolute; left: 70px; right: 70px; top: 620px; height: 980px; padding: 40px; }
  .dash .top { display: flex; justify-content: space-between; align-items: center; }
  .dash .top b { font-size: 30px; font-weight: 800; }
  .dash .top small { display: block; color: var(--text2); font-size: 21px; font-weight: 600; margin-top: 4px; }
  .live { display: inline-flex; align-items: center; gap: 10px; padding: 10px 18px; border-radius: 999px; background: rgba(124,58,237,.16); color: #C4B5FD; font-weight: 800; font-size: 20px; letter-spacing: 2px; }
  .live i { width: 12px; height: 12px; border-radius: 50%; background: var(--violet); }
  .ringwrap { position: relative; width: 400px; height: 400px; margin: 30px auto 10px; }
  .ringwrap .center { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
  .ringwrap .pct { font-family: var(--serif); font-weight: 700; font-size: 104px; color: var(--ch-title); line-height: 1; }
  .ringwrap .sub { font-size: 24px; color: var(--text2); font-weight: 600; margin-top: 8px; }
  .kpis { display: flex; gap: 18px; margin-top: 18px; }
  .kpi { flex: 1; height: 128px; padding: 20px 22px; border-radius: 24px; background: #1B1F2B; border: 1.5px solid var(--border); }
  .kpi .v { font-family: var(--serif); font-weight: 700; font-size: 46px; }
  .kpi .k { display: flex; align-items: center; gap: 8px; color: var(--text2); font-size: 20px; font-weight: 600; }
  .kpi .k i { width: 12px; height: 12px; border-radius: 50%; }
  .feed { margin-top: 22px; position: relative; height: 230px; overflow: hidden; }
  .frow { position: absolute; left: 0; right: 0; height: 70px; display: flex; align-items: center; gap: 18px; font-size: 24px; font-weight: 600; border-top: 1.5px solid var(--border); }
  .frow .time { color: var(--text3); width: 90px; font-variant-numeric: tabular-nums; }
  .frow .d { width: 14px; height: 14px; border-radius: 50%; background: var(--ok); }
  .frow .m { margin-left: auto; color: var(--ch-muted); font-size: 21px; }

  /* Segmentos */
  .seg-grid { position: absolute; left: 80px; right: 80px; top: 700px; display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
  .seg { height: 250px; border-radius: 24px; background: var(--card); border: 1.5px solid var(--border); display: flex; flex-direction: column; justify-content: center; align-items: flex-start; padding: 0 40px; gap: 20px; position: relative; overflow: hidden; }
  .seg .ic { width: 84px; height: 84px; border-radius: 22px; display: grid; place-items: center; background: rgba(232,213,163,.08); border: 1.5px solid rgba(232,213,163,.25); }
  .seg .lb { font-family: var(--serif); font-weight: 700; font-size: 44px; }
  .seg .hl { position: absolute; inset: 0; border-radius: 24px; border: 3px solid var(--violet); box-shadow: inset 0 0 60px rgba(124,58,237,.25), 0 0 40px rgba(124,58,237,.4); opacity: 0; }

  /* CTA */
  .btn { display: inline-flex; align-items: center; gap: 18px; padding: 32px 56px; border-radius: 20px; font-weight: 800; font-size: 38px;
    background: linear-gradient(135deg, var(--cta-from), var(--cta-to)); box-shadow: 0 24px 60px rgba(124,58,237,.55); }
</style>
</head>
<body>
<div id="stage"></div>
<script type="module" src="./scenes.js"></script>
</body>
</html>
